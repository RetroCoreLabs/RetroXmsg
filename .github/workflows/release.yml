name: release
on:
  push:
    tags: [ 'v*' ]
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish -c Release -nodeReuse:false -o publish
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/**
